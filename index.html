<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flamboyan — Live TV & Radio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #121212;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
      gap: 14px;
    }

    /* Site Branding & Page Navigation */
    .site-nav-wrapper {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      background: #e50914;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .page-tabs {
      display: flex;
      background: #1e1e1e;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #2d2d2d;
      gap: 4px;
    }

    .page-tab {
      background: transparent;
      border: none;
      color: #999999;
      padding: 7px 13px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .page-tab:hover {
      color: #ffffff;
      background: #282828;
    }

    .page-tab.active {
      background: #e50914;
      color: #ffffff;
      font-weight: 600;
    }

    /* Limited Frame Card Container */
    .app-card {
      background: #1e1e1e;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 680px;
      border: 1px solid #2d2d2d;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top Controls Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
      color: #ffffff;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background-color: #e50914;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(229, 9, 20, 0.8);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Custom Trigger Button */
    .menu-btn {
      background: #2a2a2a;
      color: #ffffff;
      border: 1px solid #404040;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      outline: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .menu-btn:hover {
      background: #333333;
      border-color: #555555;
    }

    /* Video Player Stage (16:9 ratio) */
    .stage {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 10px;
      overflow: hidden;
      background: #000000;
    }

    #playerContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Bottom Info Bar */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #888888;
      padding: 2px 4px;
    }

    .active-channel-tag {
      color: #cccccc;
      font-weight: 500;
    }

    /* Popup Modal Menu */
    #channelModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      max-height: 75vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 13px;
      color: #fff;
    }

    .close-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .close-btn:hover { color: #fff; }

    .channel-list {
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .channel-item {
      background: transparent;
      border: none;
      color: #cccccc;
      padding: 10px 14px;
      text-align: left;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }

    .channel-item:hover {
      background: #222222;
      color: #ffffff;
    }

    .channel-item.active {
      background: #e50914;
      color: #ffffff;
    }

    .channel-item.support {
      color: #ff4d4d;
      border-top: 1px solid #222;
      margin-top: 4px;
    }

    /* Fallback Screen */
    #offlineFallback {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #151515;
      border: 1px dashed #333;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .fallback-title { font-size: 15px; font-weight: 600; color: #ffffff; margin-bottom: 6px; }
    .fallback-desc { font-size: 12px; color: #888888; line-height: 1.4; margin-bottom: 12px; max-width: 260px; }

    .btn-support {
      background: #e50914;
      color: #fff;
      text-decoration: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      transition: background 0.2s;
    }
    .btn-support:hover { background: #f40612; }

    @media (max-width: 520px) {
      .site-nav-wrapper {
        justify-content: center;
      }
      .page-tabs {
        width: 100%;
        justify-content: space-between;
      }
      .page-tab {
        flex: 1;
        text-align: center;
        padding: 7px 8px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar (Pages) -->
  <nav class="site-nav-wrapper">
    <div class="brand">
      <span>FLAMBOYAN</span>
      <span class="brand-badge">Live</span>
    </div>

    <div class="page-tabs" role="tablist">
      <button class="page-tab active" data-page="entertainment" onclick="switchPage('entertainment')">Entertainment TV</button>
      <button class="page-tab" data-page="news" onclick="switchPage('news')">News TV</button>
      <button class="page-tab" data-page="radio" onclick="switchPage('radio')">Live Radio</button>
    </div>
  </nav>

  <!-- Main Player Card -->
  <div class="app-card">
    <header class="header">
      <div class="live-indicator">
        <span class="live-dot"></span>
        <span id="pageCategoryLabel">ENTERTAINMENT TV</span>
      </div>

      <button class="menu-btn" onclick="toggleModal()">
        <span id="menuBtnLabel">Channels ▾</span>
      </button>
    </header>

    <!-- Video Stage -->
    <main class="stage">
      <div id="playerContainer">
        <iframe
          id="livePlayer"
          src=""
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

      <!-- Fallback Screen -->
      <div id="offlineFallback">
        <div style="font-size: 28px; margin-bottom: 4px;">📺</div>
        <h3 class="fallback-title">Stream Offline</h3>
        <p class="fallback-desc">This channel feed is currently unavailable or concluded. Reach out to report a broken link.</p>
        <a href="mailto:admin@yoursite.com?subject=Stream%20Issue" class="btn-support">Contact Admin</a>
      </div>
    </main>

    <!-- Bottom Indicator Bar -->
    <div class="footer-bar">
      <span>Now Playing:</span>
      <span id="currentChannelName" class="active-channel-tag">Loading...</span>
    </div>
  </div>

  <!-- Popup Channel Selector Modal -->
  <div id="channelModal" onclick="if(event.target === this) toggleModal()">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitle">Select Channel</span>
        <button class="close-btn" onclick="toggleModal()">×</button>
      </div>
      <div class="channel-list" id="channelListContainer">
        <!-- Channels are populated dynamically per page -->
      </div>
    </div>
  </div>

        ]
      }

    let currentPageKey = "entertainment";

    function toggleModal() {
      const modal = document.getElementById("channelModal");
      modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function switchPage(pageKey, updateHash = true) {
      if (!PAGES[pageKey]) pageKey = "entertainment";
      currentPageKey = pageKey;
      const pageData = PAGES[pageKey];

      // Update URL hash so each page has its own shareable URL (e.g. #news, #radio)
      if (updateHash && window.location.hash !== "#" + pageKey) {
        history.pushState(null, "", "#" + pageKey);
      }

      // Update document title & labels
      document.title = pageData.title;
      document.getElementById("pageCategoryLabel").innerText = pageData.badge;
      document.getElementById("menuBtnLabel").innerText = pageData.menuLabel;
      document.getElementById("modalTitle").innerText = pageData.modalTitle;

      // Highlight active navigation tab
      document.querySelectorAll(".page-tab").forEach(tab => {
        tab.classList.toggle("active", tab.dataset.page === pageKey);
      });

      // Rebuild channel list in modal
      const listContainer = document.getElementById("channelListContainer");
      listContainer.innerHTML = "";

      pageData.channels.forEach((ch, index) => {
        const btn = document.createElement("button");
        btn.className = "channel-item" + (index === 0 ? " active" : "");
        btn.innerText = ch.name;
        btn.onclick = function () {
          selectStream(ch.id, ch.name, btn, true);
        };
        listContainer.appendChild(btn);
      });

      // Add Support button at bottom of every page's list
      const supportBtn = document.createElement("button");
      supportBtn.className = "channel-item support";
      supportBtn.innerText = "🔴 SUPPORT";
      supportBtn.onclick = function () {
        selectStream("OFFLINE", "SUPPORT", supportBtn, true);
      };
      listContainer.appendChild(supportBtn);

      // Load first channel of the selected page automatically
      const firstChannel = pageData.channels[0];
      selectStream(firstChannel.id, firstChannel.name, listContainer.firstChild, false);
    }

    function selectStream(videoId, channelName, element, closeModalAfter = true) {
      document.getElementById("currentChannelName").innerText = channelName;
      if (closeModalAfter) {
        document.getElementById("channelModal").style.display = "none";
      }

      document.querySelectorAll(".channel-item").forEach(btn => btn.classList.remove("active"));
      if (element) element.classList.add("active");

      const iframe = document.getElementById("livePlayer");
      const playerContainer = document.getElementById("playerContainer");
      const offlineFallback = document.getElementById("offlineFallback");

      if (videoId === "OFFLINE") {
        iframe.src = "";
        playerContainer.style.display = "none";
        offlineFallback.style.display = "flex";
      } else {
        offlineFallback.style.display = "none";
        playerContainer.style.display = "block";
        iframe.src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1&mute=1&enablejsapi=1";
      }
    }

    // Handle browser back/forward buttons & direct URL hashes
    window.addEventListener("hashchange", () => {
      const hashPage = window.location.hash.replace("#", "");
      if (PAGES[hashPage] && hashPage !== currentPageKey) {
        switchPage(hashPage, false);
      }
    });

    // Initialize on page load
    window.addEventListener("DOMContentLoaded", () => {
      const initialHash = window.location.hash.replace("#", "");
      switchPage(PAGES[initialHash] ? initialHash : "entertainment", false);
    });
  </script>
